name: ci

on:
  push:
    branches: [main]
  pull_request:

# pull_request, not pull_request_target: a fork PR must never see repository
# secrets. Read-only contents is all any job here needs.
permissions:
  contents: read

# A superseded push should stop, not keep burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA with the tag in a trailing
# comment. A tag is mutable: whoever can move it can run code in every CI run
# here, including tampering with the drift gate that keeps generated contracts
# honest. Dependabot (.github/dependabot.yml) keeps these current.

# The gate is split deliberately, and CLAUDE.md explains why in full:
#
#   build  — must be green ALWAYS. TODO(you) stubs compile (they panic at
#            runtime), so an open stub never turns this red. It is a real
#            signal even mid-phase.
#   test   — green at P0, and red exactly while a phase's stubs are open.
#            That red is the worklist, not a broken pipeline.
#
# A phase is done when both are green on a commit. Nothing is marked done
# before that.

jobs:
  contracts-drift:
    name: contracts codegen drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # "stable", not go-version-file, and this is a deliberate departure
          # from the other repos in this workspace. setup-go installs EXACTLY
          # the version named in go.mod — check-latest does not widen it —
          # which pinned CI to a Go release carrying known standard-library
          # CVEs and made the security job permanently red for a reason
          # unrelated to this code. go.mod's directive is a language-level
          # minimum; the toolchain CI builds with should be the newest patched
          # release, so a Go security release fixes the gate with no commit.
          go-version: stable
          cache-dependency-path: apps/runtime-go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/codegen/package-lock.json

      - name: Install pinned generators
        run: |
          set -euo pipefail
          source packages/contracts/codegen/versions.env
          go install "$GO_JSONSCHEMA_MODULE@$GO_JSONSCHEMA_VERSION"
          python -m venv packages/contracts/codegen/.venv
          packages/contracts/codegen/.venv/bin/pip install --quiet \
            "datamodel-code-generator==$DATAMODEL_CODEGEN_VERSION"
          npm --prefix packages/contracts/codegen ci --no-audit --no-fund

      # `git add -A` before the comparison, so the gate sees ADDED and DELETED
      # generated files too. A plain `git diff` inspects only tracked files: a
      # new schema's output would be untracked and invisible, and a deleted
      # schema's orphaned type would be unchanged and equally invisible. Both
      # would pass a gate that CLAUDE.md declares must always be green.
      - name: Regenerate and fail on drift
        run: |
          packages/contracts/codegen/generate.sh
          git add -A -- \
            apps/runtime-go/internal/contracts/gen \
            apps/retriever-python/src/models/gen \
            apps/web/src/contracts/gen
          git diff --cached --exit-code -- \
            apps/runtime-go/internal/contracts/gen \
            apps/retriever-python/src/models/gen \
            apps/web/src/contracts/gen

  build:
    name: build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # "stable", not go-version-file, and this is a deliberate departure
          # from the other repos in this workspace. setup-go installs EXACTLY
          # the version named in go.mod — check-latest does not widen it —
          # which pinned CI to a Go release carrying known standard-library
          # CVEs and made the security job permanently red for a reason
          # unrelated to this code. go.mod's directive is a language-level
          # minimum; the toolchain CI builds with should be the newest patched
          # release, so a Go security release fixes the gate with no commit.
          go-version: stable
          cache-dependency-path: apps/runtime-go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/retriever-python/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Go build and vet
        working-directory: apps/runtime-go
        run: |
          go build ./...
          go vet ./...

      - name: Python lint and type-check
        working-directory: apps/retriever-python
        run: |
          pip install --quiet -e '.[dev]'
          ruff check .
          mypy src

      - name: Web lint, type-check, and bundle
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # "stable", not go-version-file, and this is a deliberate departure
          # from the other repos in this workspace. setup-go installs EXACTLY
          # the version named in go.mod — check-latest does not widen it —
          # which pinned CI to a Go release carrying known standard-library
          # CVEs and made the security job permanently red for a reason
          # unrelated to this code. go.mod's directive is a language-level
          # minimum; the toolchain CI builds with should be the newest patched
          # release, so a Go security release fixes the gate with no commit.
          go-version: stable
          cache-dependency-path: apps/runtime-go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/retriever-python/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The whole suite runs against the committed toy fixture, so no test
      # needs a network, a credential, or a multi-gigabyte download.
      - name: Go tests (race, with coverage)
        working-directory: apps/runtime-go
        run: go test -race -cover ./...

      # --cov-fail-under and the vitest thresholds are what turn the house 80%
      # rule from a number someone reads into one CI enforces.
      - name: Python tests
        working-directory: apps/retriever-python
        run: |
          pip install --quiet -e '.[dev]'
          pytest

      - name: Web tests
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run coverage

  # Starts green today, which is exactly why it is worth adding now rather than
  # after the first vulnerable transitive dependency lands.
  security:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # "stable", not go-version-file, and this is a deliberate departure
          # from the other repos in this workspace. setup-go installs EXACTLY
          # the version named in go.mod — check-latest does not widen it —
          # which pinned CI to a Go release carrying known standard-library
          # CVEs and made the security job permanently red for a reason
          # unrelated to this code. go.mod's directive is a language-level
          # minimum; the toolchain CI builds with should be the newest patched
          # release, so a Go security release fixes the gate with no commit.
          go-version: stable
          cache-dependency-path: apps/runtime-go/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: govulncheck
        working-directory: apps/runtime-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: pip-audit
        working-directory: apps/retriever-python
        run: |
          pip install --quiet pip-audit
          pip install --quiet -e '.[dev]'
          pip-audit --strict

      - name: npm audit
        working-directory: apps/web
        run: npm audit --audit-level=high
