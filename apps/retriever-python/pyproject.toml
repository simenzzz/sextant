[project]
name = "sextant-retriever"
version = "0.1.0"
description = "Schema retrieval, reranking, and the BIRD eval harness for Sextant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    # The SQL parser behind /v1/parse. PLAN.md section 5.2 requires AST-level
    # validation and never regex; sqlglot is what makes that possible for both
    # SQLite and Postgres from one implementation.
    "sqlglot>=27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # jsonschema treats format as an annotation unless these are installed.
    # The Go, Python, and TypeScript suites all run the same fixture corpus,
    # so they must agree on whether "last tuesday" is a date-time — without
    # these two, the Python suite silently skips the format fixtures and the
    # corpus stops meaning the same thing in every language.
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    # src/contracts.py validates at every boundary with jsonschema, and mypy
    # runs strict over src, so the stubs are a build dependency and not a nicety.
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# --cov-fail-under is what turns the house 80% rule from a number someone
# reads into one the suite enforces.
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    # Generated by packages/contracts/codegen — covering it would measure the
    # generator, not this service. The fixture corpus is what proves the
    # contracts are right.
    "src/models/gen/*",
    # Process entrypoint: exercised by `docker compose up`, not by pytest.
    "src/server.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by packages/contracts/codegen/generate.sh — linting it would mean
# hand-editing generated output, which the drift gate would then revert.
extend-exclude = ["src/models/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "src/models/gen"

[[tool.mypy.overrides]]
module = "src.models.gen.*"
follow_imports = "skip"
