# Compose smoke test: brings the services up and asserts they are reachable.
#
# This is not the unit suite — it is the check that the images build, start,
# and answer. `make smoke` runs it; CI gains it at P1, when there is an actual
# request path worth exercising end to end.
name: sextant-test

services:
  retriever:
    build:
      context: ../apps/retriever-python

  runtime:
    build:
      context: ../apps/runtime-go
    environment:
      SEXTANT_ADDR: ":8080"
      SEXTANT_PROVIDER: fake
      SEXTANT_RETRIEVER_URL: http://retriever:8000
      # /data deliberately, not /tmp: /tmp is world-writable, so pointing
      # the trace store there would hide exactly the ownership bug this
      # smoke test exists to catch.
      SEXTANT_TRACE_PATH: /data/trace.sqlite
      # Without this the runtime falls back to the development default, which
      # is a path relative to the repository root — and the image's working
      # directory is /data, so it opens nothing and exits before serving. The
      # main compose file has always set this; the test file did not, so the
      # smoke test could never reach a runtime that opens a database.
      SEXTANT_DATABASES: toy=sqlite:/data/fixtures/toy.sqlite
    volumes:
      # Read-only at the mount as well as in the DSN. The AST guard is not the
      # only thing between a bad generation and the data.
      - ./fixtures:/data/fixtures:ro
    depends_on:
      - retriever

  smoke:
    image: curlimages/curl:8.11.1
    depends_on:
      - runtime
      - retriever
    volumes:
      - ./e2e:/e2e:ro
    entrypoint: ["sh", "/e2e/smoke.sh"]
